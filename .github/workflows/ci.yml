name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build --wait -d
      - run: make migrate-dev
      - run: make seed-dev
      - run: make api-test
      - run: pnpm e2e
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down
